name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; main runs always complete — the Deploy workflow
# gates production on this suite finishing green (workflow_run, ADR-065).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      CI: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # The real-Postgres integration test (tests/integration/*) asserts against
      # SEEDED data — ecosystems, taxonomy, and the imported Bangla-vasha MCQs —
      # so the fresh database needs the same three-step prep the e2e job uses:
      # schema push, seed, then the idempotent vasha import (~25s total).
      - name: Prepare test database (schema push + seed + vasha import)
        run: |
          npx prisma db push --skip-generate --schema database/prisma/schema.prisma
          npm run db:seed
          npx tsx scripts/import-bangla-vasha.ts --yes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      # Providing DATABASE_URL makes the raw-SQL + integration regression
      # guards actually run in CI instead of silently skipping.
      - name: Typecheck, lint, tests (coverage enforced), build
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run --coverage
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

  # End-to-end suite (Playwright, tests/e2e/*). Runs against a production
  # `next build` + `next start` via the Playwright webServer (dev-mode route
  # compiles blew the time budget, and Next's devtools profiling in the dev
  # runtime throws uncaught pageerrors the audit fixtures fail on), with a
  # seeded Postgres. Runs in parallel with `test`.
  e2e:
    runs-on: ubuntu-latest
    # Budget: npm ci + Playwright install + DB seed (~3min), then the
    # webServer runs `next build` before `next start` (~3-4min on a runner)
    # and the full suite against the prod server (~5-8min). 20min was not
    # enough when the suite ran against `next dev`.
    timeout-minutes: 25
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      AUTH_SECRET: ci-e2e-secret-not-for-production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare + seed e2e database
        run: |
          npx prisma db push --skip-generate --schema database/prisma/schema.prisma
          npm run db:seed
      - name: Run Playwright suite
        run: npm run test:e2e
      - name: Upload Playwright report (on failure, for triage)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Client-JS perf-budget gate (docs/PERFORMANCE-OPTIMIZATION.md §3 Phase 0).
  # Builds with the bundle analyzer and fails if the initial-JS footprint
  # regresses against the committed baseline (docs/perf/client-baseline.json).
  # Runs in parallel with `test` so it never slows the regression suite.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOTE: no NODE_ENV: production here — that would make `npm ci` skip the
    # devDependencies (next-pwa, @next/bundle-analyzer, tsx) this build needs.
    # `next build` is already a production build regardless of NODE_ENV.
    env:
      CI: true
    # The analyze build (like `test`'s) prerenders SSG routes that query
    # Prisma, so it needs a reachable DATABASE_URL to complete.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Prepare perf database (schema push)
        run: npx prisma db push --skip-generate --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      - name: Analyze build + run perf budget gate
        run: npm run perf:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      - name: Upload analyzer report (on failure, for triage)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-treemaps
          path: .next/analyze/
          retention-days: 7
          if-no-files-found: ignore

  # Secret-scanning gate (docs/SECURITY.md § Secret scanning).
  # Scans every commit reachable from the push/PR plus the full history —
  # the same command as `npm run secret-scan` locally. Uses the repo's
  # .gitleaks.toml (vendored gitleaks default rules + project allowlist)
  # and .gitleaksignore (documented false positives). `--redact` ensures
  # a real finding is never echoed into CI logs in cleartext.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the scan covers past commits too
      - name: Install gitleaks (pinned to the version .gitleaks.toml is vendored from)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan tracked files + git history for secrets
        run: gitleaks git . --no-banner --redact --exit-code 1


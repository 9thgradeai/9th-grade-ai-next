name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      CI: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Prepare test database (schema push)
        run: npx prisma db push --skip-generate --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      # The real-Postgres integration test skips silently without DATABASE_URL;
      # providing it makes the raw-SQL regression guard actually run in CI.
      - name: Typecheck, lint, tests (coverage enforced), build
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run --coverage
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

  # Client-JS perf-budget gate (docs/PERFORMANCE-OPTIMIZATION.md §3 Phase 0).
  # Builds with the bundle analyzer and fails if the initial-JS footprint
  # regresses against the committed baseline (docs/perf/client-baseline.json).
  # Runs in parallel with `test` so it never slows the regression suite.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOTE: no NODE_ENV: production here — that would make `npm ci` skip the
    # devDependencies (next-pwa, @next/bundle-analyzer, tsx) this build needs.
    # `next build` is already a production build regardless of NODE_ENV.
    env:
      CI: true
    # The analyze build (like `test`'s) prerenders SSG routes that query
    # Prisma, so it needs a reachable DATABASE_URL to complete.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Prepare perf database (schema push)
        run: npx prisma db push --skip-generate --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      - name: Analyze build + run perf budget gate
        run: npm run perf:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      - name: Upload analyzer report (on failure, for triage)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-treemaps
          path: .next/analyze/
          retention-days: 7
          if-no-files-found: ignore
